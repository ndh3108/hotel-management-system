<!doctype html>
<html>
  <head>
    <title>Test Room Type Update</title>
    <style>
      body {
        font-family: Arial;
        margin: 20px;
      }
      .form-group {
        margin: 10px 0;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      input,
      textarea {
        width: 300px;
        padding: 8px;
      }
      button {
        padding: 10px 20px;
        background: #007bff;
        color: white;
        border: none;
        cursor: pointer;
      }
      .result {
        margin-top: 20px;
        padding: 10px;
        background: #f0f0f0;
      }
    </style>
  </head>
  <body>
    <h1>Test Room Type Update</h1>

    <form
      method="POST"
      action="/doan/public/admin/room-types/1/update"
      enctype="multipart/form-data"
    >
      <div class="form-group">
        <label>Name:</label>
        <input type="text" name="name" value="Test Room" required />
      </div>

      <div class="form-group">
        <label>Capacity Adults:</label>
        <input
          type="number"
          name="capacity_adults"
          value="2"
          min="1"
          required
        />
      </div>

      <div class="form-group">
        <label>Capacity Children:</label>
        <input
          type="number"
          name="capacity_children"
          value="0"
          min="0"
          required
        />
      </div>

      <div class="form-group">
        <label>Base Price:</label>
        <input
          type="number"
          name="base_price"
          value="500000"
          min="0"
          required
        />
      </div>

      <div class="form-group">
        <label>Area (m²):</label>
        <input type="number" name="area_sqm" value="20" min="1" step="0.5" />
      </div>

      <div class="form-group">
        <button type="submit">Update Room Type</button>
      </div>
    </form>

    <div class="result">
      <h3>Expected Result:</h3>
      <p>Form should POST to /doan/public/admin/room-types/1/update</p>
      <p>
        If successful, should redirect to /doan/public/admin/room-types with
        success message
      </p>
    </div>
  </body>
</html>
